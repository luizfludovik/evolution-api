name: V7 - validar imagem Docker sem publicar

on:
  push:
    branches:
      - feature/v7-link-preview-enriquecida
  pull_request:
    branches:
      - stable/evolution-2.3.7

permissions:
  contents: read

concurrency:
  group: v7-docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar codigo da branch
        uses: actions/checkout@v4
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir imagem V7 sem enviar a registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          provenance: false
          tags: local/evolution-v7:validacao
