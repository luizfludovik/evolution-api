name: V7 - publicar imagem GHCR (sem deploy Render)

on:
  push:
    branches:
      - feature/v7-link-preview-enriquecida

permissions:
  contents: read
  packages: write

concurrency:
  group: v7-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar branch V7
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma sem acessar banco
        env:
          DATABASE_PROVIDER: postgresql
        run: npm run db:generate
      - name: Testar miniatura e links
        run: npx tsx --test test/richLinkPreview.v7.test.ts
      - name: Compilar codigo V7
        run: npm run build
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Criar e publicar imagem versionada, sem implantar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/luizfludovik/evolution-api
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/luizfludovik/evolution-api:v7-${{ github.sha }}

      - name: Avisar endereco da imagem para futuro deploy
        run: echo 'Imagem publicada ghcr.io/luizfludovik/evolution-api:v7-${{ github.sha }}'
